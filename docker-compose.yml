  market:
    build: ./market_api
    environment:
      <<: *sim-config
    volumes:
      - ./market_api:/app
      - ./market_operator:/repos/market_operator
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  balancing:
    build: ./balancing_api
    environment:
      <<: *sim-config
    volumes:
      - ./balancing_api:/app
      - ./balancing_operator:/repos/balancing_operator
      - ./market_operator:/repos/market_operator
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  database:
    build: ./database
    environment:
      DB_PATH: "/data/database.db"
    volumes:
      - ./database:/app
      - ./shared/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  orchestrator:
    build: ./orchestrator
    environment:
      HOUSEHOLD_IDS: "MAC000018,MAC000019,MAC000021,MAC000022,MAC000033,MAC000038,MAC000040,MAC000041,MAC000055,MAC000056,MAC000060,MAC000068,MAC000083,MAC000085,MAC000087,MAC000089,MAC000090,MAC000093,MAC000098,MAC000099,MAC000100,MAC000104,MAC000111,MAC000112,MAC000115,MAC000117,MAC000118,MAC000121,MAC000122,MAC000123"
      OUTPUT_ROOT: "/shared/outputs"
      TICK_SECONDS: "1.0"
      MAX_SLOTS: ""
      CONTROL_FILE: "/control/sim_control.json"
      MARKET_URL: "http://market:8000"
      BALANCING_URL: "http://balancing:8000"
      DATABASE_URL: "http://database:8000"
    volumes:
      - ./orchestrator:/app
      - ./shared/outputs:/shared/outputs
      - ./shared/control:/control
    depends_on:
      market:
        condition: service_healthy
      balancing:
        condition: service_healthy
      database:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      <<: *sim-config
      DATABASE_URL: "http://database:8000"
      CONTROL_FILE: "/control/sim_control.json"
      MARKET_REPO_ROOT: "/repos/market_operator"
    volumes:
      - ./dashboard:/app
      - ./market_operator:/repos/market_operator
      - ./shared/control:/control
    ports:
      - "8501:8501"
    depends_on:
      database:
        condition: service_healthy