x-sim-config: &sim-config
  SIM_SEASON: "winter"
  TARIFF_TARGET_YEAR: "2025"
  TARIFF_AGG: "median"
  TOU_CSV_PATH: "ToU_London.csv"
  FIT_CSV_PATH: "FiT_London.csv"

x-household-env: &household-env
  <<: *sim-config
  PARAMS_FILE: "household_params.csv"
  OUTPUT_ROOT: "/shared/outputs"
  FORECAST_MODE: "cnn6"
  FUTURE_SIGNAL_WEIGHTS: "1.0,0.85,0.70,0.55,0.40,0.25"
  SIM_START_DATE: "2013-02-27 00:00:00"
  SIM_END_DATE: "2014-02-27 23:00:00"

x-household-common: &household-common
  build: ./Households
  volumes:
    - ./Households:/app
    - ./final_models:/app/final_models:ro
    - ./shared/outputs:/shared/outputs

